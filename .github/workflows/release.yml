name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: webkitgtk for the linux window
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: release build
        run: cargo build --release -p gitd

      - uses: actions/upload-artifact@v4
        with:
          name: gitd-${{ matrix.os }}
          path: |
            target/release/gitd
            target/release/gitd.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: name binaries per platform
        run: |
          mv dist/gitd-windows-latest/gitd.exe gitd-windows-x64.exe
          mv dist/gitd-ubuntu-latest/gitd gitd-linux-x64
          mv dist/gitd-macos-latest/gitd gitd-macos-arm64
          chmod +x gitd-linux-x64 gitd-macos-arm64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gitd-windows-x64.exe
            gitd-linux-x64
            gitd-macos-arm64
