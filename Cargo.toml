[workspace]
resolver = "2"
members = ["crates/graph", "crates/patch", "crates/gitcore", "crates/workspace", "crates/gitd"]

[workspace.package]
edition = "2021"
version = "0.6.0"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
